  <path d="M 50 21 C 44 19 37 20 32 23 L 32 45 C 37 42 44 41 50 43 Z" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Kalkulator / regnebrett på venstre bokside -->
  <rect x="18" y="25" width="10" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.8" />
  <line x1="20.5" y1="28.5" x2="25.5" y2="28.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
  <circle cx="21" cy="32" r="1" fill="#ffffff" />
  <circle cx="25" cy="32" r="1" fill="#ffffff" />
  <circle cx="21" cy="35.2" r="1" fill="#ffffff" />
  <circle cx="25" cy="35.2" r="1" fill="#ffffff" />

  <!-- Blyant skrått over høyre bokside -->
