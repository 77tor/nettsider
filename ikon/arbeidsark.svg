    <rect x="-3" y="-11" width="6" height="16" rx="1" fill="#0369a1" stroke="#ffffff" stroke-width="2" />
    <polygon points="-3,5 3,5 0,11" fill="#ffffff" />
    <line x1="-3" y1="-6.5" x2="3" y2="-6.5" stroke="#ffffff" stroke-width="1.6" />
